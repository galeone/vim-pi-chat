name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install -y vim
          vim --version | head -3
          vim --version | grep -E '\+job \+channel' || vim --version

      - uses: actions/setup-node@v7
        with:
          node-version: 25

      - name: Run tests
        run: sh test/run.sh

  test-nvim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim
          nvim --version | head -3

      - uses: actions/setup-node@v7
        with:
          node-version: 25

      - name: Run tests (Neovim)
        run: VIM=nvim sh test/run.sh

  # semantic-release: bump the version from conventional commits (fix:/feat:/BREAKING CHANGE),
  # tag it (vX.Y.Z) and publish a GitHub Release with generated notes.
  # Runs only after the E2E suite passes, on pushes to main.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - name: Release
        run: npx -y semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
